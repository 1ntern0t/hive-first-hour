# GitHub Actions workflow for hive-first-hour.
# Runs npm test on Node 20 and 22, then checks that docs/index.html is current.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Static page is up to date
        run: node scripts/build-web.js && git diff --exit-code docs/index.html
